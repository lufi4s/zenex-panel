<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Zenex Panel</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <main id="login-view" class="card" hidden>
    <h1>Zenex Panel</h1>
    <form id="login-form" novalidate>
      <label>Email
        <input name="email" type="email" autocomplete="username" required maxlength="254">
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required maxlength="1024">
      </label>
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit">Sign in</button>
    </form>
  </main>

  <div id="app-view" hidden>
    <header class="topbar">
      <strong>Zenex</strong>
      <span class="spacer"></span>
      <span id="who" class="muted"></span>
      <button id="logout" type="button" class="ghost">Sign out</button>
    </header>

    <main class="page">
      <p class="server-strip" aria-label="Server status">
        <span id="m-load">Load —</span>
        <span id="m-mem">Memory —</span>
        <span id="m-disk">Disk —</span>
        <span id="m-uptime">Uptime —</span>
        <span id="metrics-error" class="error" role="alert"></span>
      </p>

      <section class="card">
        <h2>Your domain</h2>
        <ul id="domain-list" class="list"></ul>
        <form id="domain-form" class="inline" novalidate>
          <input name="apex" placeholder="yourdomain.com" required maxlength="253" aria-label="Domain">
          <button type="submit">Add domain</button>
        </form>
        <p id="domain-error" class="error" role="alert"></p>
        <p class="note">After adding, point a wildcard DNS record (<code>*</code>) to this server's IP. The panel checks it for you.</p>
      </section>

      <section class="card">
        <h2>New website</h2>
        <form id="site-form" class="inline wrap" novalidate>
          <select name="apex" id="site-apex" required aria-label="Domain"></select>
          <input name="label" placeholder="shop" required maxlength="28" aria-label="Website name" pattern="[a-z][a-z0-9-]{1,26}[a-z0-9]">
          <button type="submit">Create</button>
        </form>
        <p class="note" id="site-preview"></p>
        <p id="site-error" class="error" role="alert"></p>
        <div id="progress" hidden>
          <p><strong id="progress-title">Building website</strong></p>
          <ol id="progress-steps" class="steps"></ol>
          <p id="progress-error" class="error" role="alert"></p>
          <button type="button" id="retry-job" class="ghost" hidden>Retry</button>
        </div>
      </section>

      <section class="card">
        <h2>Your websites</h2>
        <ul id="site-list" class="sites"></ul>
        <p id="sites-empty" class="note" hidden>No websites yet.</p>
      </section>
    </main>
  </div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
